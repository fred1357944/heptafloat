<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Inter; font-weight: 400; src: url(fonts/Inter-Regular.woff2) format("woff2"); }
  @font-face { font-family: Inter; font-weight: 600; src: url(fonts/Inter-SemiBold.woff2) format("woff2"); }
  @font-face { font-family: Inter; font-weight: 700; src: url(fonts/Inter-Bold.woff2) format("woff2"); }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body { font-family: Inter, -apple-system, sans-serif; color: #f2f3f5; position: relative;
    background: radial-gradient(90% 120% at 0% 0%, #4b2a52 0%, transparent 55%),
                radial-gradient(80% 100% at 100% 0%, #1d3a6b 0%, transparent 60%),
                radial-gradient(90% 100% at 70% 100%, #0f4d5c 0%, transparent 60%), #14161c; }
  .copy { position: absolute; left: 80px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .copy img { width: 120px; height: 120px; margin: 0 0 22px -10px; }
  h1 { font-size: 76px; font-weight: 700; letter-spacing: -2px; margin: 0; }
  p { font-size: 29px; line-height: 1.35; color: rgba(255,255,255,.78); margin: 14px 0 30px; }
  .pills { display: flex; gap: 10px; }
  .pills span { font-size: 17px; font-weight: 600; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.1); color: rgba(255,255,255,.85); }
  .card { position: absolute; left: 720px; top: 70px; width: 440px; height: 510px; border-radius: 14px; overflow: hidden;
    -webkit-backdrop-filter: blur(30px); box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 30px 80px rgba(0,0,0,.6); }
  .card iframe { width: 100%; height: 100%; border: 0; display: block; }
  .kbd { position: absolute; left: 1090px; top: 40px; font-size: 18px; font-weight: 600; padding: 8px 14px; border-radius: 10px;
    background: #2e3033; color: #fff; box-shadow: 0 0 0 1px rgba(255,255,255,.14), 0 10px 30px rgba(0,0,0,.4); }
</style>
</head>
<body>
  <div class="copy">
    <img src="icon-1024.png" alt="">
    <h1>HeptaFloat</h1>
    <p>Today's Heptabase journal,<br>one keystroke away.</p>
    <div class="pills"><span>macOS</span><span>Free &amp; open source</span><span>Light &amp; dark</span></div>
  </div>
  <div class="card"><iframe id="card" src="card.html"></iframe></div>
  <div class="kbd">⌃ ⌥ J</div>
</body>
</html>
